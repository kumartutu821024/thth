<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>TARGET BOARD FREE BATCH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { margin:0; font-family: 'Segoe UI', Arial; background: #000; color:#fff; overflow-x: hidden; }
        .header { padding:10px 15px; background: rgba(20, 20, 20, 0.95); backdrop-filter: blur(10px); font-weight:bold; display:flex; align-items:center; box-shadow:0 4px 15px rgba(0,0,0,0.5); border-bottom: 1px solid #333; position: sticky; top: 0; z-index: 90; }
        #title { font-size:14px; color: #fff; flex: 1; overflow: hidden; }
        .ticker-wrap { width: 100%; background: #ffff00; border: 2px solid #00ffcc; box-shadow: 0 0 10px #00ffcc; border-radius: 6px; overflow: hidden; white-space: nowrap; height: 28px; display: flex; align-items: center; position: relative; }
        .ticker { display: inline-block; padding-left: 100%; animation: ticker-move 30s linear infinite; color: #000; font-weight: 800; font-size: 13px; text-transform: uppercase; }
        @keyframes ticker-move { 0% { transform: translate3d(0, 0, 0); } 100% { transform: translate3d(-100%, 0, 0); } }
        .back { margin-right:12px; cursor:pointer; font-size:18px; color: #00ffcc; }
        .search { grid-column: 1 / -1; margin-bottom: 5px; }
        .search input { width:100%; padding:10px 15px; border-radius:8px; border:1px solid #333; outline:none; background:#1a1a1a; color: #fff; box-sizing: border-box; font-size: 13px; }
        #main { display: grid; gap: 8px; padding: 8px; }
        #main.course-view { grid-template-columns: repeat(2, 1fr); }
        #main.list-view { grid-template-columns: repeat(3, 1fr); }
        #content { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        .course, .item { position: relative; background: #111; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; border: 1px solid #222; height: 100%; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        .thumb-container { position: relative; width: 100%; aspect-ratio: 16/9; background: #000; overflow: hidden; }
        .course img, .item img { width: 100%; height: 100%; object-fit: cover; }
        .course-title { padding: 4px 6px; font-size: 10px; font-weight: 700; text-align: left; color: #fff; background: #1a1a1a; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.1; }
        .tabs { grid-column: 1 / -1; display:flex; background:#1a1a1a; border-radius:10px; overflow:hidden; border: 1px solid #333; margin-bottom: 10px; }
        .tab { flex:1; padding:12px; text-align:center; cursor:pointer; font-weight:bold; color: #888; }
        .tab.active { background: #00ffcc; color:#000; }
        .loader { grid-column: 1 / -1; text-align:center; padding:40px; }
        .loader span { display:inline-block; width:12px; height:12px; margin:4px; background:#00ffcc; border-radius:50%; animation: bounce 0.6s infinite alternate; }
        @keyframes bounce { to { transform: translateY(-10px); } }
        @media (max-width: 480px) {
            #main.course-view { grid-template-columns: 1fr; gap: 12px; }
            #main.list-view { grid-template-columns: repeat(2, 1fr); }
            #content { grid-template-columns: repeat(4, 1fr); }
        }
    </style>
</head>
<body>
    <div class="header">
        <span id="backBtn" class="back" style="display:none;" onclick="window.history.back()">⬅</span>
        <div id="title">
            <div class="ticker-wrap"><div class="ticker" id="ticker-text">LOADING...</div></div>
        </div>
    </div>
    <div id="main"></div>
    <script src="app.js"></script>
</body>
</html>
