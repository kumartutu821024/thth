<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TARGET PLAYER</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/shaka-player/4.3.5/shaka-player.compiled.debug.js"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
        .player-container { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
        video, iframe { width: 100%; height: 100%; background: #000; border: none; }
        .back-btn { position: absolute; top: 15px; left: 15px; background: rgba(0,0,0,0.5); color: #00ffcc; border: 1px solid #00ffcc; padding: 5px 15px; border-radius: 20px; text-decoration: none; z-index: 100; font-size: 14px; }
        .loading { color: #fff; font-family: sans-serif; }
    </style>
</head>
<body>
    <a href="javascript:history.back()" class="back-btn">⬅ Back</a>
    <div class="player-container" id="player-root">
        <div class="loading">Loading Player...</div>
    </div>

    <script>
        async function init() {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('id');
            if (!id) return;

            if (id.length === 11) {
                // YouTube
                document.getElementById('player-root').innerHTML = `<iframe src="https://www.youtube.com/embed/${id}?autoplay=1&rel=0" allowfullscreen allow="autoplay"></iframe>`;
                return;
            }

            try {
                const res = await fetch(`/api/test?id=${id}`);
                const data = await res.json();
                const v = data.v;

                const streamUrl = `https://d3tphhabckqhz3.cloudfront.net/0fa5a6dd93b56a6/transcoded/${v}/video.mpd`;

                document.getElementById('player-root').innerHTML = `<video id="video" controls autoplay crossorigin="anonymous"></video>`;

                shaka.polyfill.installAll();
                const video = document.getElementById('video');
                const player = new shaka.Player(video);

                try {
                    await player.load(streamUrl);
                } catch (e) {
                    // Fallback
                    window.location.href = `https://targetboard.co.in/dashboard/video?v=${v}`;
                }
            } catch (err) {
                console.error("Error loading video", err);
            }
        }
        init();
    </script>
</body>
</html>
